<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Топливо LV">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
<title>Топливо LV</title>
</head>
<body>
<header class="top">
  <button class="city-btn" id="cityBtn" type="button" aria-haspopup="dialog">
    <span class="city-label">Город</span>
    <span class="city-name" id="cityName">Рига</span>
  </button>
  <h1 class="page-title" id="pageTitle" hidden></h1>
  <div class="top-actions">
    <button class="icon-btn" id="refreshBtn" type="button" aria-label="Обновить цены"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg></button>
    <button class="icon-btn" id="gearBtn" type="button" aria-label="Настройки"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
  </div>
</header>

<nav class="fuels" id="fuels" aria-label="Вид топлива"></nav>

<main id="main" tabindex="-1">
  <div id="banners"></div>
  <div id="content"></div>
</main>

<nav class="tabs" id="tabs" aria-label="Разделы">
  <button type="button" data-tab="city" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><b>В городе</b><span>самая выгодная</span></button>
  <button type="button" data-tab="near"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></svg><b>Рядом</b><span>в радиусе</span></button>
  <button type="button" data-tab="fresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><b>Свежие</b><span>цена обновилась</span></button>
</nav>

<dialog id="citySheet" aria-labelledby="cityTitle">
  <form method="dialog" class="sheet-head"><h2 id="cityTitle">Выберите город</h2><button class="icon-btn" aria-label="Закрыть">✕</button></form>
  <div class="sheet-body" id="cityList"></div>
</dialog>

<dialog id="settingsSheet" aria-labelledby="setTitle">
  <form method="dialog" class="sheet-head"><h2 id="setTitle">Настройки</h2><button class="icon-btn" aria-label="Закрыть">✕</button></form>
  <div class="sheet-body" id="settingsBody"></div>
</dialog>

<dialog id="mapSheet" aria-labelledby="mapTitle">
  <form method="dialog" class="sheet-head"><h2 id="mapTitle">Открыть маршрут в</h2><button class="icon-btn" aria-label="Закрыть">✕</button></form>
  <div class="sheet-body">
    <p id="mapStation" class="price-station"></p>
    <button class="map-opt" type="button" data-map="google"><span class="map-dot" style="--c:#34a853">G</span>Google Maps</button>
    <button class="map-opt" type="button" data-map="apple"><span class="map-dot" style="--c:#0a84ff">A</span>Apple Maps</button>
    <button class="map-opt" type="button" data-map="waze"><span class="map-dot" style="--c:#33ccff">W</span>Waze</button>
  </div>
</dialog>

<dialog id="priceSheet" aria-labelledby="priceTitle">
  <form method="dialog" class="sheet-head"><h2 id="priceTitle">Цена</h2><button class="icon-btn" aria-label="Закрыть">✕</button></form>
  <div class="sheet-body">
    <p id="priceStation" class="price-station"></p>
    <label class="price-field">Цена, € за литр
      <input id="priceInput" type="text" inputmode="decimal" autocomplete="off" placeholder="0,975">
    </label>
    <p id="priceErr" class="price-err" role="alert"></p>
    <p class="price-note">Цена сохраняется только на этом телефоне.</p>
    <button class="primary" type="button" id="priceSave">Сохранить</button>
    <button class="more" type="button" id="priceClear">Удалить мою цену</button>
  </div>
</dialog>

<script src="app.js"></script>
</body>
</html>
