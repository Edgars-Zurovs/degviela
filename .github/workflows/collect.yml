name: Сбор цен и публикация

on:
  schedule:
    - cron: "17 * * * *"      # каждый час (сети обновляют цены не чаще раза в сутки)
  workflow_dispatch:          # кнопка «Run workflow» для ручного запуска
  push:
    branches: [main]
    paths: ["web/**", "collector/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Тесты
        run: python -m unittest discover -s collector/tests -t .
      - name: Сбор цен
        env:
          CONTACT: ${{ secrets.CONTACT }}
        run: python -m collector.collector --data data --out web/data
      - name: Сохранить данные в репозитории
        if: always()
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data web/data
          git diff --cached --quiet || git commit -m "Обновление цен"
          git push || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
